name: 🛠️ Loli-Core GKI 极速编译流水线

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04
    steps:
    - name: 🧹 第〇步：简单粗暴清理空间 (不搞虚拟磁盘)
      uses: jlumbroso/free-disk-space@main
      with:
        # 开启清理选项，保留足够空间
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 🧰 第一步：准备极客编译底层环境 (补全 Python)
      run: |
        sudo apt-get update
        # 注意最后加了 python-is-python3
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

    - name: 📦 第二步：拉取 SM8750 完整源码 (并极限压榨空间)
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        mkdir -p ~/workspace
        cd ~/workspace
        
        echo "开始同步源码..."
        # ⚠️ 注意下面这一行，加入了 -m oneplus_13.xml 解决找不到 default.xml 的问题
        repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8750 -m oneplus_13.xml --depth=1
        
        # 接下来开始拉取（这一步耗时最长，大概需要十几分钟到半小时）
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        echo "代码拉取完毕，执行磁盘保命大法！"
        # 删掉隐藏的 Git 历史文件，给后面的 Bazel 编译腾出 30GB+ 的空间
        rm -rf .repo/
        
    - name: 🔨 第三步：注入防爆配置并开始编译内核
      run: |
        cd ~/workspace
        
        # 1. 进入真正的内核工作区
        cd kernel_platform
        
        # 2. 给 Bazel 注入紧箍咒，防止 GitHub Actions 内存溢出 (OOM)
        echo "startup --host_jvm_args=-Xmx3g" > .bazelrc
        echo "build --local_ram_resources=4096" >> .bazelrc
        echo "build --local_cpu_resources=2" >> .bazelrc
        echo "build --worker_max_instances=2" >> .bazelrc
        
        # 3. 退回到 workspace 根目录执行一加官方的编译指令
        cd ~/workspace
        ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
        
    - name: 📦 第四步：暴力提取心脏与模块
      run: |
        mkdir -p ~/loli_output
        # Bazel 构建产物通常在 out/ 或 bazel-bin/ 下，建议多提一些关键产物
        find ~/workspace/android_kernel_oneplus_sm8750 -name "Image" -type f -exec cp {} ~/loli_output/ \;
        find ~/workspace/android_kernel_oneplus_sm8750 -name "*.ko" -type f -exec cp {} ~/loli_output/ \;
        # 如果有打包好的完整镜像
        find ~/workspace/android_kernel_oneplus_sm8750 -name "boot.img" -type f -exec cp {} ~/loli_output/ \;
        echo "大局已定！提取成功！"

    - name: 📤 第五步：将编译成果上传
      uses: actions/upload-artifact@v4
      with:
        name: Loli-Core-Kernel-SM8750
        path: ~/loli_output/*
