name: 🛠️ Loli-Core GKI 极速编译流水线

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04
    steps:
    - name: 🧹 第〇步：简单粗暴清理空间 (不搞虚拟磁盘)
      uses: jlumbroso/free-disk-space@main
      with:
        # 开启清理选项，保留足够空间
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 🧰 第一步：准备极客编译底层环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

    - name: 📦 第二步：拉取 Ace 6 原生源码 (并极限压榨空间)
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        mkdir -p ~/workspace
        cd ~/workspace
        
        echo "🔥 开始初始化一加 Ace 6 的官方原生编译清单..."
        # 【核心修改点】：直接使用原生的 oneplus_ace_6.xml
        repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8750 -m oneplus_ace_6.xml --depth=1
        
        echo "🚀 开始全速拉取 Ace 6 原生代码（这步耗时较长，大概十几分钟）..."
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        echo "🧹 代码拉取完毕，执行磁盘保命大法（清理 .repo 目录）！"
        # 删掉隐藏的 Git 历史文件，给后面的 Bazel 编译腾出 30GB+ 的空间
        rm -rf .repo/
        
    - name: 🔨 第三步：注入防爆配置并开始编译内核
      run: |
        cd ~/workspace
        
        echo "清理损坏的 Git 软链接..."
        find . -name ".git" -type l -delete
        
        echo "做戏做全套，重建核心目录的完整 Git 仓库..."
        git config --global user.name "Builder"
        git config --global user.email "build@localhost.com"
        git config --global init.defaultBranch main
        
        # 针对这三个最喜欢用 git 的核心目录，建立真实的本地跟踪
        for dir in kernel_platform kernel_platform/common kernel_platform/msm-kernel; do
          if [ -d "$dir" ]; then
            echo "正在修复 $dir 的 Git 状态..."
            cd ~/workspace/$dir
            git init
            git add .
            git commit -m "Fake commit with all files" || true
          fi
        done
        
        echo "🛡️ 注入 Bazel 紧箍咒 (防内存溢出)..."
        cd ~/workspace
        echo "startup --host_jvm_args=-Xmx3g" > .bazelrc
        echo "build --local_resources=memory=4096,cpu=2" >> .bazelrc
        echo "build --worker_max_instances=2" >> .bazelrc
        echo "build --workspace_status_command=/bin/true" >> .bazelrc
        
        echo "🔥 再次点火！开始真正的内核编译！"
        # sun 是 SM8750 平台的统取代号，配合 ace 6 的专属清单，它会自动编译出属于你的核心
        ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
        
    - name: 🗂️ 第四步：收集编译产物 (精确提取)
      run: |
        echo "创建输出目录..."
        mkdir -p ~/loli_output/4k_standard
        mkdir -p ~/loli_output/16k_performance
        
        cd ~/workspace/kernel_platform/out/msm-kernel-sun-perf/
        
        echo "提取 4K 标准版内核产物..."
        cp -v dist/Image ~/loli_output/4k_standard/ || true
        cp -v dist/boot.img ~/loli_output/4k_standard/ || true
        cp -v dist/vendor_boot.img ~/loli_output/4k_standard/ || true
        cp -v dist/dtbo.img ~/loli_output/4k_standard/ || true
        
        echo "提取 16K 极客版内核产物..."
        cp -v dist16k/Image ~/loli_output/16k_performance/ || true
        cp -v dist16k/boot.img ~/loli_output/16k_performance/ || true
        cp -v dist16k/vendor_boot.img ~/loli_output/16k_performance/ || true
        cp -v dist16k/dtbo.img ~/loli_output/16k_performance/ || true
        
        echo "==========================================="
        echo "🎉 精确收集完毕！战利品分类如下："
        ls -lhR ~/loli_output/
        echo "==========================================="

    - name: 🚀 第五步：上传内核产物
      uses: actions/upload-artifact@v4
      with:
        # 【修改点】：将导出的压缩包命名为 Ace 6
        name: OnePlus-Ace-6-Kernel-SM8750
        path: ~/loli_output/*
