name: 🛠️ Loli-Core GKI 极速编译流水线

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04
    steps:
    - name: 🧹 第〇步：简单粗暴清理空间 (不搞虚拟磁盘)
      uses: jlumbroso/free-disk-space@main
      with:
        # 开启清理选项，保留足够空间
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 🧰 第一步：准备极客编译底层环境 (补全 Python)
      run: |
        sudo apt-get update
        # 注意最后加了 python-is-python3
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

    - name: 📦 第二步：拉取 SM8750 完整源码 (并极限压榨空间)
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        mkdir -p ~/workspace
        cd ~/workspace
        
        echo "开始同步源码..."
        # ⚠️ 注意下面这一行，加入了 -m oneplus_13.xml 解决找不到 default.xml 的问题
        repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8750 -m oneplus_13.xml --depth=1
        
        # 接下来开始拉取（这一步耗时最长，大概需要十几分钟到半小时）
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        echo "代码拉取完毕，执行磁盘保命大法！"
        # 删掉隐藏的 Git 历史文件，给后面的 Bazel 编译腾出 30GB+ 的空间
        rm -rf .repo/
        
    - name: 🔨 第三步：注入防爆配置并开始编译内核
      run: |
        cd ~/workspace
        
        # --- 魔法开始：伪造 Git 环境，骗过高通的验证系统 ---
        echo "修复 Git 状态检查..."
        git config --global user.name "Builder"
        git config --global user.email "build@localhost.com"
        git config --global init.defaultBranch main
        
        # 在主目录和核心目录初始化假的 git 仓库
        cd kernel_platform
        git init && git commit --allow-empty -m "Fake commit" || true
        
        if [ -d "msm-kernel" ]; then
          cd msm-kernel
          git init && git add . || true
          git commit --allow-empty -m "Fake commit" || true
          cd ..
        fi
        # --- 魔法结束 ---
        
        # 注入 Bazel 紧箍咒 (防内存溢出)
        echo "startup --host_jvm_args=-Xmx3g" > .bazelrc
        echo "build --local_resources=memory=4096,cpu=2" >> .bazelrc
        echo "build --worker_max_instances=2" >> .bazelrc
        # 强制关闭严格的版本状态检查
        echo "build --workspace_status_command=/bin/true" >> .bazelrc
        
        # 回到 workspace 执行官方编译指令
        cd ~/workspace
        ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
        
    - name: 🗂️ 第四步：收集编译产物 (打扫战场)
      run: |
        echo "创建输出目录..."
        mkdir -p ~/loli_output
        
        echo "开启全图雷达，智能扫描编译好的内核文件..."
        cd ~/workspace
        
        # 智能搜索所有 out 目录下的核心镜像文件，并直接提取到 loli_output 中
        # 注意：限定路径包含 "out" 是为了防止把源码里自带的旧文件复制过来
        find . -path "*/out/*" -type f \( -name "Image" -o -name "boot.img" -o -name "vendor_boot.img" -o -name "dtbo.img" -o -name "dtb" \) -exec cp -v {} ~/loli_output/ \;
        
        echo "==========================================="
        echo "🎉 产物收集完毕！看看我们的战利品："
        ls -lh ~/loli_output/
        echo "==========================================="

    - name: 🚀 第五步：上传内核产物
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13-Kernel-SM8750
        path: ~/loli_output/*
