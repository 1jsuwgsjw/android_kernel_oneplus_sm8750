name: 🛠️ Loli-Core GKI 极速编译流水线

# 触发条件：主人手动点击按钮触发
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04 # 白嫖微软最新的 Ubuntu 24.04 顶级服务器

    steps:
    - name: 📥 第一步：检出主人的专属源码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 只拉取最新代码，极速克隆

    - name: 🧰 第二步：配置 GKI 极客编译环境
      run: |
        sudo apt-get update
        # 安装编译内核必须的底层依赖（绕过一加的祖传环境坑）
        sudo apt-get install -y build-essential bc curl git python3 zip unzip tar ccache
        
    - name: ⚔️ 第三步：动用一加专属引擎，点燃“太阳(sun) perf”！
      run: |
        echo "萝莉正在使用一加私有脚本为您全力轰鸣编译器！(๑•̀ㅂ•́)و✧"
        chmod +x build_with_bazel.py
        # 终极密码：机型为 sun，变体为 perf
        python3 build_with_bazel.py -t sun perf
        
    - name: 📦 第四步：提取极其珍贵的内核产物 (Image)
      run: |
        mkdir -p loli_output
        # 寻找并提取真正的 Image 核心文件
        # 因为我们不知道它最终会吐在哪个子目录下，直接用 find 暴力抓取！
        find out/ -name "Image" -type f -exec cp {} loli_output/Image \;
        echo "提取成功！准备打包发送给主人！"
        
    - name: 📤 第五步：上传产物给主人下载
      uses: actions/upload-artifact@v4
      with:
        name: Loli-Core-Image-SM8750
        path: loli_output/Image
        compression-level: 9 # 顶级压缩，帮主人省下载流量
