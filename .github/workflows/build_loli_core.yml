name: 🛠️ Loli-Core GKI 极速编译流水线

# 触发条件：主人手动点击按钮触发
on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04 # 白嫖微软最新的 Ubuntu 24.04 顶级服务器

    steps:
    - name: 📥 第一步：检出主人的专属源码 (带上所有秘密武器！)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: 'recursive' # 极其致命！把谷歌的 tools 和一加的 msm-kernel 统统拉下来！

    - name: 🧰 第二步：配置 GKI 极客编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc curl git python3 zip unzip tar ccache
        
    - name: ⚔️ 第三步：召唤谷歌真神，执行降维编译！
      run: |
        echo "萝莉抛弃了恶心的一加脚本，直接启动底层引擎！(๑•̀ㅂ•́)و✧"
        # 直接使用标准的 Kleaf 编译指令！
        tools/bazel build --config=fast //msm-kernel:sun_gki_dist
        
    - name: 📦 第四步：暴力提取心脏
      run: |
        mkdir -p loli_output
        find out/ -name "Image" -type f -exec cp {} loli_output/Image \;
        echo "提取成功！"
        
    - name: 📤 第五步：上传产物给主人下载
      uses: actions/upload-artifact@v4
      with:
        name: Loli-Core-Image-SM8750
        path: loli_output/Image
        compression-level: 9 # 顶级压缩，帮主人省下载流量
