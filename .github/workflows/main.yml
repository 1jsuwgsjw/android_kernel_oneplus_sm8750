name: 🛠️ Loli-Core GKI 极速编译流水线 (全套不掉驱动版 + 防封内核模块)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: 🚀 编译一加 Ace 6 (SM8750) 核心
    runs-on: ubuntu-24.04
    steps:
    - name: 🧹 第〇步：简单粗暴清理空间 (不搞虚拟磁盘)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 🧰 第一步：准备极客编译底层环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

    - name: 📦 第二步：拉取源码 -> 注入魔改核心 -> 极限压榨空间
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        mkdir -p ~/workspace
        cd ~/workspace
        
        echo "🔥 开始初始化一加 Ace 6 的官方原生编译清单..."
        repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8750 -m oneplus_ace_6.xml --depth=1
        
        echo "🚀 开始全速拉取 Ace 6 原生代码（这步耗时较长，大概十几分钟）..."
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        # ==========================================================
        # 💉 【核心注入魔法区】开始：趁着 .repo 还在，强行替换为你的代码！
        # ==========================================================
        echo "💉 准备注入你的 21 个魔改 Commits..."
        cd ~/workspace/kernel_platform/msm-kernel
        
        git remote add my_loli_fork https://github.com/1jsuwgsjw/android_kernel_oneplus_sm8750.git
        echo "🔥 正在从你的仓库抓取代码..."
        git fetch my_loli_fork oneplus/sm8750_b_16.0.0_ace_6
        
        echo "⚡ 强行替换当前目录下的官方代码，换成你写的！"
        git checkout FETCH_HEAD
        
        echo "✅ 替换成功！来看看当前最新的代码提交："
        git log -n 1 --oneline
        # ==========================================================
        # 💉 【核心注入魔法区】结束。你的心血已经注入物理文件。
        # ==========================================================
        
        echo "🧹 代码拉取和替换均完毕，退回工作区，执行磁盘保命大法（清理 .repo 目录）！"
        cd ~/workspace
        rm -rf .repo/
        
    - name: 🔨 第三步：注入防封驱动与防爆配置并开始编译
      run: |
        cd ~/workspace
        
        echo "清理损坏的 Git 软链接..."
        find . -name ".git" -type l -delete
        
        echo "做戏做全套，重建核心目录的完整 Git 仓库..."
        git config --global user.name "Builder"
        git config --global user.email "build@localhost.com"
        git config --global init.defaultBranch main
        
        for dir in kernel_platform kernel_platform/common kernel_platform/msm-kernel; do
          if [ -d "$dir" ]; then
            echo "正在修复 $dir 的 Git 状态..."
            cd ~/workspace/$dir
            git init
            git add .
            git commit -m "Fake commit with all files" || true
          fi
        done
        
        # ==========================================================
        # 🛡️ 【防封驱动骨架注入区】开始
        # ==========================================================
        echo "🔥 正在植入自定义内存读写防封驱动 (my_rw_bypass.ko)..."
        
        cat << 'EOF' > ~/workspace/kernel_platform/msm-kernel/drivers/misc/my_rw_bypass.c
        #include <linux/module.h>
        #include <linux/init.h>
        #include <linux/fs.h>
        #include <linux/miscdevice.h>
        #include <linux/uaccess.h>
        #include <linux/sched.h>
        #include <linux/mm.h>

        struct rw_pack {
            pid_t pid;
            unsigned long address;
            void __user *buffer;
            size_t size;
        };

        #define IOCTL_READ_MEM  _IOWR('R', 1, struct rw_pack)
        #define IOCTL_WRITE_MEM _IOWR('R', 2, struct rw_pack)

        static int kernel_rw_memory(struct rw_pack *pack, int is_write) {
            struct task_struct *task;
            struct mm_struct *mm;
            void *bounce_buffer;
            int res = -1;

            task = get_pid_task(find_vpid(pack->pid), PIDTYPE_PID);
            if (!task) return -ESRCH;

            mm = get_task_mm(task);
            if (!mm) {
                put_task_struct(task);
                return -ESRCH;
            }

            bounce_buffer = kmalloc(pack->size, GFP_KERNEL);
            if (!bounce_buffer) goto out_mm;

            if (is_write) {
                if (copy_from_user(bounce_buffer, pack->buffer, pack->size)) goto out_free;
                if (access_process_vm(task, pack->address, bounce_buffer, pack->size, FOLL_FORCE | FOLL_WRITE) == pack->size) res = 0;
            } else {
                if (access_process_vm(task, pack->address, bounce_buffer, pack->size, FOLL_FORCE) == pack->size) {
                    if (!copy_to_user(pack->buffer, bounce_buffer, pack->size)) res = 0;
                }
            }

        out_free:
            kfree(bounce_buffer);
        out_mm:
            mmput(mm);
            put_task_struct(task);
            return res;
        }

        static long my_rw_ioctl(struct file *file, unsigned int cmd, unsigned long arg) {
            struct rw_pack pack;
            if (copy_from_user(&pack, (void __user *)arg, sizeof(pack))) return -EFAULT;

            switch (cmd) {
                case IOCTL_READ_MEM:
                    return kernel_rw_memory(&pack, 0);
                case IOCTL_WRITE_MEM:
                    return kernel_rw_memory(&pack, 1);
                default:
                    return -EINVAL;
            }
        }

        static const struct file_operations my_rw_fops = {
            .owner = THIS_MODULE,
            .unlocked_ioctl = my_rw_ioctl,
        };

        static struct miscdevice my_rw_device = {
            .minor = MISC_DYNAMIC_MINOR,
            .name = "my_rw_bridge",
            .fops = &my_rw_fops,
        };

        static int __init my_rw_init(void) {
            misc_register(&my_rw_device);
            printk(KERN_INFO "[RootImGui] Stealth Bridge Created at /dev/my_rw_bridge\n");
            return 0;
        }

        static void __exit my_rw_exit(void) {
            misc_deregister(&my_rw_device);
            printk(KERN_INFO "[RootImGui] Stealth Bridge Destroyed\n");
        }

        module_init(my_rw_init);
        module_exit(my_rw_exit);
        MODULE_LICENSE("GPL");
        MODULE_AUTHOR("RootImGui");
        MODULE_DESCRIPTION("Stealth Memory RW Module");
        EOF
        
        echo "obj-m += my_rw_bypass.o" >> ~/workspace/kernel_platform/msm-kernel/drivers/misc/Makefile
        # ==========================================================
        # 🛡️ 【防封驱动骨架注入区】结束
        # ==========================================================

        echo "🛡️ 注入 Bazel 紧箍咒 (防内存溢出)..."
        cd ~/workspace
        echo "startup --host_jvm_args=-Xmx3g" > .bazelrc
        echo "build --local_resources=memory=4096,cpu=2" >> .bazelrc
        echo "build --worker_max_instances=2" >> .bazelrc
        echo "build --workspace_status_command=/bin/true" >> .bazelrc
        
        echo "🔥 点火！开始 4K 标准版内核编译！"
        ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
        
        echo "🔥 再次点火！追加 16K 极客版内核编译！"
        ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf 16k
        
    - name: 🗂️ 第四步：智能收集编译产物 (全图雷达搜索)
      run: |
        echo "创建收集篮..."
        mkdir -p ~/loli_output/kernel_dist
        
        cd ~/workspace/kernel_platform
        echo "🔥 启动全图雷达，正在全盘搜寻编译产物..."
        
        # 精确抓捕我们的终极防封模块！找到就立刻复制过来！
        find . -type f -name "my_rw_bypass.ko" -exec cp -v {} ~/loli_output/kernel_dist/ \;
        
        # 顺手把 boot.img 等可能需要的官方镜像也找出来（可选备用）
        find . -type f -name "boot.img" -exec cp -v {} ~/loli_output/kernel_dist/ \;
        
        echo "==========================================="
        echo "🎉 雷达收集完毕，请查看最终收获："
        ls -lh ~/loli_output/kernel_dist/ || echo "收集篮为空，请检查上一步是否成功生成"
        echo "==========================================="

    - name: 🚀 第五步：上传防封模块产物
      uses: actions/upload-artifact@v4
      with:
        name: RootImGui-Bypass-Module
        path: ~/loli_output/kernel_dist/*
        compression-level: 9
